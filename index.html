<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عبدالله صقر | بارستا</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;

      background:
        radial-gradient(circle at top, #374151, transparent 45%),
        linear-gradient(145deg, #111827, #030712);
    }

    .card {
      width: 100%;
      max-width: 430px;
      text-align: center;
      padding: 30px 22px;
      border-radius: 30px;

      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);

      backdrop-filter: blur(20px);
      box-shadow: 0 25px 70px rgba(0,0,0,0.45);
    }

    .profile {
      width: 175px;
      height: 175px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid white;

      box-shadow: 0 10px 35px rgba(0,0,0,0.4);

      margin-bottom: 18px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .job {
      font-size: 19px;
      color: #d1d5db;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      text-decoration: none;
      color: white;

      padding: 17px;
      border-radius: 16px;

      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.12);

      font-size: 18px;
      font-weight: bold;

      transition: 0.25s;
    }

    .link:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,0.18);
    }

    .whatsapp {
      background: rgba(37,211,102,0.18);
    }

    .instagram {
      background: rgba(225,48,108,0.18);
    }

    .facebook {
      background: rgba(24,119,242,0.18);
    }

    footer {
      margin-top: 25px;
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="card">

    <img
      src="profile.jpg"
      alt="عبدالله صقر"
      class="profile"
    >

    <h1>عبدالله صقر</h1>

    <p class="job">☕ بارستا</p>

    <div class="links">

      <a
        class="link whatsapp"
        href="https://wa.me/201067179924"
        target="_blank"
      >
        💬 واتساب
      </a>

      <a
        class="link instagram"
        href="https://www.instagram.com/3bdo_sak4"
        target="_blank"
      >
        📷 إنستجرام
      </a>

      <a
        class="link facebook"
        href="https://www.facebook.com/share/1ErvvxMDEk/"
        target="_blank"
      >
        👍 فيسبوك
      </a>

    </div>

    <footer>
      عبدالله صقر • Barista
    </footer>

  </div>

</body>
</html>
